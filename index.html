<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>顧客情報</title>

  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 24px 16px;
    background: #f1f6f3;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      "Hiragino Kaku Gothic ProN",
      "Yu Gothic",
      Meiryo,
      sans-serif;
    color: #26332c;
  }

  .container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  /* ページ上部 */
  .page-header {
    margin-bottom: 22px;
    padding: 0 4px;
  }

  .page-title {
    margin: 0;
    color: #1f6d46;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .page-subtitle {
    margin-top: 6px;
    color: #789084;
    font-size: 13px;
  }

  .vehicle-id {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 12px;
    background: #e3f2e9;
    color: #1f6d46;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }

  /* カード */
  .info-card {
    margin-bottom: 18px;
    overflow: hidden;
    background: #ffffff;
    border: 1px solid #dce9e1;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(31, 109, 70, 0.06);
  }

  .card-header {
    padding: 13px 18px;
    background: #287a50;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .card-body {
    padding: 5px 20px;
  }

  /* 各項目 */
  .row {
    padding: 15px 0;
    border-bottom: 1px solid #edf2ef;
  }

  .row:last-child {
    border-bottom: none;
  }

  .label {
    margin-bottom: 5px;
    color: #718077;
    font-size: 12px;
    font-weight: 600;
  }

  .value {
    min-height: 25px;
    color: #26332c;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.5;
    word-break: break-word;
  }

  /* 氏名は少し強調 */
  .name-value {
    color: #174d33;
    font-size: 22px;
  }

  /* 住所 */
  .address-value {
    line-height: 1.8;
  }

  /* 読み込み中 */
  #loading {
    margin-top: 40px;
    padding: 30px;
    color: #1f6d46;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
  }

  /* エラー */
  #error {
    display: none;
    margin-bottom: 16px;
    padding: 18px;
    color: #a82323;
    background: #fff1f1;
    border: 1px solid #efcccc;
    border-radius: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  #customerInfo {
    display: none;
  }

  /* タブレット */
  @media (max-width: 600px) {
    body {
      padding: 16px 12px;
    }

    .page-title {
      font-size: 24px;
    }

    .card-body {
      padding: 4px 16px;
    }

    .value {
      font-size: 17px;
    }

    .name-value {
      font-size: 21px;
    }
  }
</style>
</head>

<body>

  <div class="container">

    <div id="loading">
      顧客情報を読み込んでいます...
    </div>

    <div id="error"></div>

    <div id="customerInfo">

  <div class="page-header">

    <h1 class="page-title">
      お客様情報
    </h1>

    <div class="page-subtitle">
      CUSTOMER INFORMATION
    </div>

    <div class="vehicle-id">
      車両ID：<span id="vehicleId"></span>
    </div>

  </div>


  <!-- お客様 -->
  <div class="info-card">

    <div class="card-header">
      お客様
    </div>

    <div class="card-body">

      <div class="row">
        <div class="label">フリガナ</div>
        <div class="value" id="furigana"></div>
      </div>

      <div class="row">
        <div class="label">氏名</div>
        <div class="value name-value" id="name"></div>
      </div>

    </div>

  </div>


  <!-- ご連絡先 -->
  <div class="info-card">

    <div class="card-header">
      ご連絡先
    </div>

    <div class="card-body">

      <div class="row">
        <div class="label">自宅番号</div>
        <div class="value" id="phoneHome"></div>
      </div>

      <div class="row">
        <div class="label">携帯番号</div>
        <div class="value" id="phoneMobile"></div>
      </div>

    </div>

  </div>


  <!-- ご住所 -->
  <div class="info-card">

    <div class="card-header">
      ご住所
    </div>

    <div class="card-body">

      <div class="row">
        <div class="label">郵便番号</div>
        <div class="value" id="postalCode"></div>
      </div>

      <div class="row">
        <div class="label">住所</div>

        <div class="value address-value">
          <div id="address1"></div>
          <div id="address2"></div>
          <div id="address3"></div>
          <div id="addressManual"></div>
        </div>

      </div>

    </div>

  </div>


  <!-- お車 -->
  <div class="info-card">

    <div class="card-header">
      お車
    </div>

    <div class="card-body">

      <div class="row">
        <div class="label">車名</div>
        <div class="value" id="carName"></div>
      </div>

      <div class="row">
        <div class="label">登録番号</div>
        <div class="value" id="registrationNumber"></div>
      </div>

    </div>

  </div>

</div>

  </div>


  <script>
    const FLOW_URL = "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/d16e39d6d0ff4faabbe0a9bf1ce2417b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=oGGn3CgyfgKqxlSJIQu8y3GLl-AEn7PvQ3Jcuiistrg";

    const vehicleId = "8832";


    function setText(id, value) {
      document.getElementById(id).textContent =
        value === null || value === undefined || value === ""
          ? "－"
          : String(value);
    }


    function showError(message) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("customerInfo").style.display = "none";

      const errorElement = document.getElementById("error");

      errorElement.textContent = message;
      errorElement.style.display = "block";
    }


    async function loadCustomer() {

      try {

        if (
          !FLOW_URL ||
          FLOW_URL === "ここにPowerAutomateのHTTP POST URLを入れる" ||
          FLOW_URL === "ここにPower AutomateのHTTP POST URLを入れる"
        ) {
          throw new Error(
            "FLOW_URLにPower AutomateのHTTP POST URLが設定されていません。"
          );
        }


        console.log("送信する車両ID:", vehicleId);


        const response = await fetch(FLOW_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            vehicleId: vehicleId
          })

        });


        const responseText = await response.text();


        console.log("HTTPステータス:", response.status);
        console.log("Power Automate応答:", responseText);


        if (!response.ok) {

          throw new Error(
            "Power Automate通信エラー\n" +
            "HTTPステータス: " +
            response.status +
            "\n\n" +
            responseText
          );

        }


        let data;


        try {

          data = JSON.parse(responseText);

        } catch (e) {

          throw new Error(
            "Power Automateから返されたデータがJSONではありません。\n\n" +
            responseText
          );

        }


        console.log("JSON変換後:", data);


        if (data.success !== true) {

          throw new Error(
            "Power Automateから正常応答が返っていません。\n\n" +
            JSON.stringify(data, null, 2)
          );

        }


        if (!data.customer) {

          throw new Error(
            "応答データにcustomerがありません。\n\n" +
            JSON.stringify(data, null, 2)
          );

        }


        const customer = data.customer;


        setText(
          "vehicleId",
          customer.vehicleId
        );

        setText(
          "furigana",
          customer.furigana
        );

        setText(
          "name",
          customer.name
        );

        setText(
          "phoneHome",
          customer.phoneHome
        );

        setText(
          "phoneMobile",
          customer.phoneMobile
        );

        setText(
          "postalCode",
          customer.postalCode
        );

        setText(
          "address1",
          customer.address1
        );

        setText(
          "address2",
          customer.address2
        );

        setText(
          "address3",
          customer.address3
        );

        setText(
          "addressManual",
          customer.addressManual
        );

        setText(
          "carName",
          customer.carName
        );

        setText(
          "registrationNumber",
          customer.registrationNumber
        );


        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "none";
        document.getElementById("customerInfo").style.display = "block";


      } catch (error) {

        console.error(error);

        showError(
          error && error.message
            ? error.message
            : String(error)
        );

      }

    }


    loadCustomer();
  </script>

</body>
</html>
